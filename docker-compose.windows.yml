services:
  app:
    image: fleet-ui:dev
    build:
      context: .
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      WORLD: ${WORLD:-warehouse}
      FLEET_START_DELAY: ${FLEET_START_DELAY:-18}
      BACKEND_START_DELAY: ${BACKEND_START_DELAY:-10}
      FLEET_CORS_ORIGINS: ${FLEET_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "5173:5173"
      - "8000:8000"
    volumes:
      - ./fleet_ws/routes:/workspace/fleet_ws/routes
      - ./fleet_ws/collections:/workspace/fleet_ws/collections
      - ./frontend/public:/workspace/frontend/public
    command: ["/workspace/docker/run-all-headless.sh"]
